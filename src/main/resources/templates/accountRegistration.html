<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Account</title>
</head>
<body>
<h2>Register Your Bank Account</h2>

<form th:action="@{/register/account}" method="post" th:object="${accountForm}">
    <div>
        <label>Account Number:</label>
        <input type="text" th:field="*{accountNumber}" required/>
    </div>
    <div>
        <label>Account Type:</label>
        <input type="text" th:field="*{accountType}" required/>
    </div>
    <div>
        <label>Currency:</label>
        <input type="text" th:field="*{currency}" required/>
    </div>
    <div>
        <button type="submit">Submit</button>
    </div>
</form>
</body>
</html>
